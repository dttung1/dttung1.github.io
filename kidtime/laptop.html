<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laptop mô phỏng</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <style>
    body { background: #0B1220; color: #F2F2F7; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
    .desk {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      background: radial-gradient(1200px 600px at 20% 10%, #3B4BB8 0%, transparent 60%),
                  radial-gradient(900px 700px at 90% 90%, #7C3AED 0%, transparent 55%), #0B1220;
    }
    .note { margin: 12px auto 0; padding: 8px 14px; border-radius: 10px; background: rgba(0, 0, 0, .35); font-size: 13px; color: #C7CBE0; max-width: calc(100% - 32px); text-align: center; }
    .stage { flex: 1; display: grid; place-items: center; padding: 16px; min-height: 0; }
    .win { width: min(720px, 100%); border-radius: 10px; overflow: hidden; background: #F3F3F3; color: #1C1C1E; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
    .win .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; font-size: 13px; border-bottom: 1px solid #E5E5E5; }
    .win .bar .tile { width: 22px; height: 22px; border-radius: 5px; font-size: 11px; }
    .win .bar .ctl { margin-left: auto; letter-spacing: 14px; color: #555; }
    .win .body { padding: 18px; display: grid; gap: 14px; }
    .win h2 { margin: 0; font-size: 20px; }
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .apps button { background: #fff; border-radius: 10px; padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 12px; border: 1.5px solid transparent; }
    .apps button[aria-current="true"] { border-color: #4F46E5; }
    .apps button .lockmark { font-size: 11px; color: #DC2626; font-weight: 600; }
    .apps button.dim { opacity: .45; }
    .taskbar { height: 52px; background: rgba(32, 32, 40, .82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; gap: 10px; padding: 0 12px calc(env(safe-area-inset-bottom)); }
    .taskbar .start { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
    .taskbar .start i { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 18px; height: 18px; }
    .taskbar .start i b { background: #60A5FA; border-radius: 1px; }
    .tray { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .kt { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, .08); }
    .kt .dot { color: #30D158; }
    .kt.warn .dot { color: #FFB020; } .kt.study .dot { color: #B79CFF; }
    .ask-btn { padding: 7px 12px; border-radius: 8px; background: #4F46E5; color: #fff; font-weight: 600; font-size: 13px; }
    .clock { font-variant-numeric: tabular-nums; color: #E5E7EB; }
    .lock {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; text-align: center;
      background: rgba(10, 12, 24, .82); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); animation: fade .25s;
    }
    .lock .box { max-width: 420px; width: 100%; display: grid; gap: 14px; justify-items: center; }
    .lock .big { font-size: 64px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
    .lock svg { width: 40px; height: 40px; }
    .lock h2 { margin: 0; font-size: 22px; }
    .lock p { margin: 0; color: #C7CBE0; }
    .lock form { width: 100%; display: grid; gap: 10px; margin-top: 6px; }
    .lock input { padding: 12px 14px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .1); color: #fff; }
    .lock input::placeholder { color: #9CA3AF; }
    .lock .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lock .status { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .08); width: 100%; }
    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; padding: 10px; border-radius: 10px; background: rgba(255, 255, 255, .1); font-weight: 600; }
    .seg button[aria-pressed="true"] { background: #fff; color: #111; }
    .wtoast { position: fixed; right: 12px; bottom: 64px; z-index: 30; width: min(340px, calc(100% - 24px)); background: #202028; color: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); font-size: 14px; animation: drop .3s; }
    .wtoast small { display: block; color: #9CA3AF; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="laptop.js"></script>
</body>
</html>
